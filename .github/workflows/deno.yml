name: BBen Build Input Validation

on:
  push:
    branches:
      - main
      - test/phase-3-isolated-validation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate deployment inputs and PWA metadata
        run: node scripts/validate-build.mjs
