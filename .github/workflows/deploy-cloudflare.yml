name: Deploy BBen to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare static assets
        run: |
          set -e
          test -f store.html
          mkdir -p public
          cp index.html styles.css app.js supabase-client.js seller.html seller.css seller.js merchant-profile.html merchant-profile.js market.html market.css market.js store.html public/
          test -f public/store.html
          echo "Verified public store page is included in deployment assets."

      - name: Verify Cloudflare deployment secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret in GitHub Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Deploy static assets to Cloudflare Workers
        run: npx --yes wrangler@4.80.0 deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_ACCOUNT_ID: 50b014526ccbc86942e2555fe3807ccf
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
