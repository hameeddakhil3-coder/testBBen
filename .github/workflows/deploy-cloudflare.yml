name: Deploy BBen to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bben-cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare static assets
        run: |
          set -e
          test -f store.html
          test -f merchant-profile.html
          test -f merchant-profile.js
          test -f customer-profile.html
          test -f customer-profile.js
          test -f platform.html
          test -f platform.css
          test -f platform.js
          test -f platform/index.html
          mkdir -p public
          cp index.html styles.css app.js supabase-client.js seller.html seller.css seller.js merchant-profile.html merchant-profile.js customer-profile.html customer-profile.js market.html market.css market.js store.html platform.html platform.css platform.js public/
          cp platform.html public/admin.html
          mkdir -p public/platform
          cp platform/index.html public/platform/index.html
          test -s public/store.html
          test -s public/platform.html
          test -s public/admin.html
          test -s public/platform.css
          test -s public/platform.js
          test -s public/platform/index.html
          test -s public/index.html
          test -s public/customer-profile.html
          test -s public/customer-profile.js
          echo "Verified required deployed assets:"
          find public -maxdepth 1 -type f -printf '%f (%s bytes)\n' | sort

      - name: Build self-contained admin dashboard Worker
        run: |
          set -e
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          html = Path("platform.html").read_text()
          css = Path("platform.css").read_text()
          client = Path("supabase-client.js").read_text()
          app = Path("platform.js").read_text()

          html, n_css = re.subn(
              r'<link rel="stylesheet" href="platform\.css[^"]*">',
              lambda _: "<style>\n" + css + "\n</style>",
              html,
              count=1,
          )
          html, n_client = re.subn(
              r'<script src="supabase-client\.js"></script>',
              lambda _: "<script>\n" + client + "\n</script>",
              html,
              count=1,
          )
          html, n_app = re.subn(
              r'<script src="platform\.js[^"]*" defer></script>',
              "",
              html,
              count=1,
          )
          if (n_css, n_client, n_app) != (1, 1, 1):
              raise SystemExit("Could not inline the expected dashboard assets.")
          html = html.replace("</body>", "<script>\n" + app + "\n</script></body>")
          worker = (
              "const ADMIN_HTML = " + json.dumps(html, ensure_ascii=False) + ";\n"
              "export default { async fetch(request, env) {\n"
              "  const url = new URL(request.url);\n"
              "  if (url.pathname === '/admin.html' || url.pathname === '/platform' || url.pathname === '/platform/') return new Response(ADMIN_HTML, { headers: { 'content-type': 'text/html; charset=utf-8', 'cache-control': 'no-store' } });\n"
              "  return env.ASSETS.fetch(request);\n"
              "} };\n"
          )
          # Build the buyer account as a self-contained Worker response as well.
          customer_html = Path("customer-profile.html").read_text()
          seller_css = Path("seller.css").read_text()
          supabase_client = Path("supabase-client.js").read_text()
          customer_app = Path("customer-profile.js").read_text()

          customer_html, n_css = re.subn(
              r'<link rel="stylesheet" href="seller\.css(?:\?[^"]*)?">',
              lambda _: "<style>\n" + seller_css + "\n</style>",
              customer_html,
              count=1,
          )
          customer_html, n_client = re.subn(
              r'<script src="supabase-client\.js"></script>',
              lambda _: "<script>\n" + supabase_client + "\n</script>",
              customer_html,
              count=1,
          )
          customer_html, n_app = re.subn(
              r'<script src="customer-profile\.js[^"]*" defer></script>',
              "",
              customer_html,
              count=1,
          )
          if (n_css, n_client, n_app) != (1, 1, 1):
              raise SystemExit("Could not inline the expected buyer account assets.")
          customer_html = customer_html.replace(
              "</body>", "<script>\n" + customer_app + "\n</script></body>"
          )

          worker = worker.replace(
              "export default { async fetch(request, env) {",
              "const CUSTOMER_HTML = " + json.dumps(customer_html, ensure_ascii=False) + ";\n"
              "export default { async fetch(request, env) {",
              1,
          )
          worker = worker.replace(
              "  if (url.pathname === '/admin.html') return new Response(ADMIN_HTML, { headers: { 'content-type': 'text/html; charset=utf-8', 'cache-control': 'no-store' } });\n",
              "  if (url.pathname === '/admin.html') return new Response(ADMIN_HTML, { headers: { 'content-type': 'text/html; charset=utf-8', 'cache-control': 'no-store' } });\n"
              "  if (url.pathname === '/customer-profile.html') return new Response(CUSTOMER_HTML, { headers: { 'content-type': 'text/html; charset=utf-8', 'cache-control': 'no-store' } });\n",
              1,
          )
          Path("worker.generated.js").write_text(worker)
          config = json.loads(Path("wrangler.jsonc").read_text())
          config["main"] = "worker.generated.js"
          # Run the Worker before static asset lookup so explicit HTML routes cannot be shadowed by asset handling.
          config["assets"]["run_worker_first"] = True
          Path("wrangler.deploy.jsonc").write_text(json.dumps(config, indent=2))
          print("Built self-contained /admin.html and /customer-profile.html entry points.")
          PY

      - name: Verify Cloudflare deployment secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret in GitHub Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Deploy static assets to Cloudflare Workers
        run: |
          set -e
          LATEST_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$LATEST_SHA" != "$GITHUB_SHA" ]; then
            echo "Skipping stale deployment for $GITHUB_SHA; main is now $LATEST_SHA"
            exit 0
          fi
          echo "Deploying current main commit $GITHUB_SHA"
          npx --yes wrangler@4.80.0 deploy --config wrangler.deploy.jsonc --assets ./public
        env:
          CLOUDFLARE_ACCOUNT_ID: 50b014526ccbc86942e2555fe3807ccf
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
