name: Deploy BBen to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare static assets
        run: |
          mkdir -p public
          cp index.html styles.css app.js supabase-client.js seller.html seller.css seller.js market.html market.css market.js public/

      - name: Deploy static assets to Cloudflare Workers
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_ACCOUNT_ID: 50b014526ccbc86942e2555fe3807ccf
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
